name: Fetch WeRead Data

on:
  schedule:
    # 每天 08:17 UTC（北京 16:17）自动拉取
    - cron: "17 8 * * *"
  workflow_dispatch: # 支持手动触发

# 最小权限：只需写入仓库内容
permissions:
  contents: write

env:
  # 指向仓库内的 vendor 副本（scripts/weread_cli/）
  WEREAD_SKILL_DIR: ${{ github.workspace }}/scripts
  # GitHub Actions Ubuntu runner 用 python3
  WEREAD_PYTHON: python3
  # API Key 从 Secrets 读取，绝不硬编码
  WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Fetch WeRead data
        run: pnpm fetch-weread

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet src/data/weread/shelf.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "📗 shelf.json 无变化，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📘 shelf.json 有更新"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/weread/shelf.json
          git commit -m "chore(weread): update shelf data [skip ci]"
          git push
